[project]
name = "ai-search"
version = "0.1.0"
description = "WorkFit AI 자막 검색 모듈 (백엔드에서 pip install -e ../ai-search 로 설치)"
requires-python = ">=3.12"
dependencies = ["fastapi", "chromadb", "google-genai", "sqlalchemy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_search"]
